<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Fabio7X Arcade</title>
  <desc id="desc">Banner neon animado para o perfil de Fabio7X</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#070713"/>
      <stop offset=".5" stop-color="#17113a"/>
      <stop offset="1" stop-color="#071a28"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" x2="1"><stop stop-color="#ff3e67"/><stop offset="1" stop-color="#ff8faf"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#00d9ff"/><stop offset="1" stop-color="#8df4ff"/></linearGradient>
    <filter id="glowPink"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowCyan"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#00d9ff" stroke-opacity=".13"/></pattern>
    <style>
      .mono { font-family: 'Courier New', monospace; }
      .orbit { transform-origin: 600px 190px; animation: orbit 9s linear infinite; }
      .pulse { animation: pulse 2.5s ease-in-out infinite; transform-origin: center; }
      .scan { animation: scan 3.8s ease-in-out infinite; }
      .blink { animation: blink 1.1s steps(2,end) infinite; }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes pulse { 50% { opacity: .38; transform: scale(.86); } }
      @keyframes scan { 0%,100% { transform: translateX(-360px); opacity: 0; } 20%,80% { opacity: .85; } 50% { transform: translateX(360px); } }
      @keyframes blink { 50% { opacity: .35; } }
    </style>
  </defs>
  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <rect x="20" y="20" width="1160" height="290" rx="18" fill="url(#grid)"/>
  <circle cx="100" cy="-10" r="150" fill="#9b5cff" opacity=".18" class="pulse"/>
  <circle cx="1110" cy="300" r="180" fill="#00d9ff" opacity=".12" class="pulse"/>
  <g class="orbit" opacity=".5" fill="none" stroke="#9b5cff" stroke-width="2"><ellipse cx="600" cy="190" rx="370" ry="100"/><ellipse cx="600" cy="190" rx="350" ry="75" transform="rotate(24 600 190)"/></g>
  <g transform="translate(80 65)">
    <rect width="160" height="170" rx="16" fill="#0b0b20" stroke="#00d9ff" stroke-width="3" filter="url(#glowCyan)"/>
    <rect x="23" y="24" width="114" height="82" rx="8" fill="#081b2d" stroke="#00d9ff"/>
    <path d="M45 80l18-28 17 18 14-25 22 35" fill="none" stroke="#ff3e67" stroke-width="5"/>
    <circle cx="49" cy="133" r="11" fill="#ff3e67" class="blink"/><circle cx="111" cy="133" r="11" fill="#00d9ff" class="blink"/>
    <path d="M64 166h32" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(960 68)">
    <rect width="155" height="165" rx="16" fill="#0b0b20" stroke="#ff3e67" stroke-width="3" filter="url(#glowPink)"/>
    <rect x="22" y="23" width="111" height="80" rx="8" fill="#230e2f" stroke="#ff3e67"/>
    <path d="M43 80h18V55h18v25h18V42h18v38h15" fill="none" stroke="#00d9ff" stroke-width="5"/>
    <circle cx="48" cy="130" r="11" fill="#00d9ff" class="blink"/><circle cx="108" cy="130" r="11" fill="#ff3e67" class="blink"/>
    <path d="M59 160h34" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g text-anchor="middle">
    <text x="600" y="114" fill="#d9d7f5" font-size="17" font-weight="700" letter-spacing="7" class="mono">// DIGITAL CREATOR · GAME MAKER</text>
    <text x="600" y="180" fill="none" stroke="#f8f7ff" stroke-width="1.6" font-size="62" font-weight="900" letter-spacing="-2" class="mono">FABIO</text>
    <text x="600" y="247" fill="url(#pink)" filter="url(#glowPink)" font-size="70" font-weight="900" letter-spacing="-3" class="mono">7X ARCADE</text>
    <text x="600" y="280" fill="#00d9ff" font-size="13" font-weight="700" letter-spacing="5" class="mono"><tspan>PLAY</tspan><tspan class="blink">_</tspan><tspan>BUILD</tspan><tspan class="blink">_</tspan><tspan>REPEAT</tspan></text>
  </g>
  <rect class="scan" x="420" y="48" width="360" height="2" rx="1" fill="url(#cyan)" filter="url(#glowCyan)"/>
</svg>
